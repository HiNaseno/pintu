<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">电商素材生成流程图</title>
  <desc id="flow-desc">上传商品素材，AI 分析主体、卖点和风格，生成商品主图、卖点详情、规格展示和店铺视觉，并适配淘宝、天猫、拼多多、抖音、1688等平台。</desc>
  <defs>
    <linearGradient id="paper-gradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.56" stop-color="#f2fdff" />
      <stop offset="1" stop-color="#ffffff" />
    </linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2 L11 7 L2 12" fill="none" stroke="#2d3035" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#18181b" flood-opacity="0.10" />
    </filter>
    <style>
      .paper-bg{fill:url(#paper-gradient)}
      .ambient{fill:none;stroke:#18181b;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 10;opacity:.055}
      .card{fill:#fff;stroke:#24262b;stroke-width:3;filter:url(#soft-shadow)}
      .ai-card{fill:#d9f99d;stroke:#18181b;stroke-width:3.6;filter:url(#soft-shadow)}
      .output-card{fill:#fff;stroke:#2e3035;stroke-width:2.4;filter:url(#soft-shadow)}
      .title{fill:#18181b;font:700 26px system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
      .ai-title{fill:#18181b;font:800 31px system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;text-anchor:middle}
      .note{fill:#71717a;font:650 18px system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
      .output-title{fill:#18181b;font:700 19px system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;text-anchor:middle}
      .output-note{fill:#71717a;font:600 14px system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;text-anchor:middle}
      .section-label{fill:#71717a;font:700 14px system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;text-anchor:middle}
      .line,.spark,.orbit,.image-line{fill:none;stroke:#18181b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .flow-arrow{fill:none;stroke:#2d3035;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 10;marker-end:url(#arrow);opacity:.62;animation:dashFlow 2.8s linear infinite}
      .branch{fill:none;stroke:#2d3035;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 9;opacity:.42}
      .dot-lime{fill:#d9f99d;stroke:#18181b;stroke-width:3}
      .platform-wrap{fill:rgba(255,255,255,.86);stroke:#d8edf1;stroke-width:2.2;filter:url(#soft-shadow)}
      .platform-title{fill:#18181b;font:700 24px system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
      .chip rect{fill:#d9f99d;stroke:#18181b;stroke-width:2.8}
      .chip text{fill:#18181b;text-anchor:middle;font:800 22px system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
      .chip-dark rect{fill:#18181b}
      .chip-dark text{fill:#fff}
      .mini text{font-size:16px}
      @keyframes dashFlow{to{stroke-dashoffset:-72}}
      @media (prefers-reduced-motion: reduce){.flow-arrow{animation:none}}
    </style>
  </defs>

  <rect class="paper-bg" width="1280" height="500" rx="18" />
  <path class="ambient" d="M108 418 C152 445,210 444,254 415" />
  <path class="ambient" d="M1088 78 C1118 54,1158 60,1174 92 C1198 88,1216 104,1218 128" />

  <g transform="translate(84 124) rotate(-1)">
    <rect class="card" width="230" height="142" rx="18" />
    <path class="image-line" d="M36 94 L78 50 L108 82 L132 62 L180 102" />
    <circle class="dot-lime" cx="178" cy="48" r="16" />
    <text class="title" x="30" y="42">上传素材</text>
    <text class="note" x="30" y="120">实拍图 / SKU / 包装</text>
  </g>

  <path class="flow-arrow" d="M330 196 C382 170,420 170,462 196" />

  <g transform="translate(480 70)">
    <rect class="ai-card" width="300" height="230" rx="30" />
    <circle class="orbit" cx="150" cy="90" r="54" />
    <path class="spark" d="M150 39 L160 78 L200 90 L160 102 L150 145 L139 102 L99 90 L139 78 Z" />
    <text class="ai-title" x="150" y="172">AI 分析商品</text>
    <text class="note" x="150" y="202" text-anchor="middle">主体 / 卖点 / 风格</text>
  </g>

  <path class="flow-arrow" d="M800 196 C850 170,884 171,926 196" />

  <g transform="translate(936 88)">
    <rect class="platform-wrap" width="224" height="214" rx="24" />
    <text class="platform-title" x="28" y="44">适配平台</text>
    <g class="chip" transform="translate(28 68) rotate(-2)">
      <rect width="58" height="54" rx="16" />
      <text x="29" y="36">淘</text>
    </g>
    <g class="chip chip-dark" transform="translate(100 68) rotate(2)">
      <rect width="58" height="54" rx="16" />
      <text x="29" y="36">猫</text>
    </g>
    <g class="chip" transform="translate(28 136) rotate(2)">
      <rect width="58" height="54" rx="16" />
      <text x="29" y="36">拼</text>
    </g>
    <g class="chip" transform="translate(100 136) rotate(-2)">
      <rect width="58" height="54" rx="16" />
      <text x="29" y="36">抖</text>
    </g>
    <g class="chip mini" transform="translate(168 104) rotate(2)">
      <rect width="72" height="54" rx="16" />
      <text x="36" y="34">1688</text>
    </g>
  </g>

  <path class="branch" d="M630 304 V338" />
  <path class="branch" d="M310 338 H960" />
  <text class="section-label" x="630" y="330">生成电商素材</text>

  <g transform="translate(250 358)">
    <rect class="output-card" width="154" height="92" rx="16" />
    <text class="output-title" x="77" y="38">商品主图</text>
    <text class="output-note" x="77" y="64">平台尺寸适配</text>
  </g>
  <g transform="translate(430 358)">
    <rect class="output-card" width="154" height="92" rx="16" />
    <text class="output-title" x="77" y="38">卖点详情</text>
    <text class="output-note" x="77" y="64">长图排版生成</text>
  </g>
  <g transform="translate(610 358)">
    <rect class="output-card" width="154" height="92" rx="16" />
    <text class="output-title" x="77" y="38">规格展示</text>
    <text class="output-note" x="77" y="64">颜色规格展示</text>
  </g>
  <g transform="translate(790 358)">
    <rect class="output-card" width="154" height="92" rx="16" />
    <text class="output-title" x="77" y="38">店铺视觉</text>
    <text class="output-note" x="77" y="64">Logo / 店招素材</text>
  </g>
</svg>
