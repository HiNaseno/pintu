<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">平台商品图生成流程图</title>
  <desc id="flow-desc">上传商品图，经过 AI 分析后，生成适配淘宝、天猫、1688、拼多多等平台的主图、详情页、SKU图和Logo。</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2 L11 7 L2 12" fill="none" stroke="#18181b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <filter id="paper-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#18181b" flood-opacity="0.08" />
    </filter>
    <style>
      .paper-bg{fill:#fff}
      .cloud,.loop{fill:none;stroke:rgba(24,24,27,.12);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 12}
      .card,.out{fill:#fff;stroke:#18181b;stroke-width:3.2;filter:url(#paper-shadow)}
      .lime{fill:#d9f99d}
      .line,.arrow,.spark,.orbit,.doodle{fill:none;stroke:#18181b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .arrow{marker-end:url(#arrow);stroke-width:3.4;stroke-dasharray:1 9;animation:dashFlow 2.8s linear infinite}
      .sun,.dot-lime{fill:#d9f99d;stroke:#18181b;stroke-width:3}
      .dot{fill:#fff;stroke:#18181b;stroke-width:3}
      .node-title,.platform-title,.output-title{fill:#18181b;font:950 25px system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
      .note{fill:#71717a;font:760 18px system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
      .center{text-anchor:middle}
      .platform-icon rect,.platform-icon circle{stroke:#18181b;stroke-width:3;filter:url(#paper-shadow)}
      .platform-icon text{fill:#18181b;text-anchor:middle;font:950 22px system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
      .platform-icon .mini{font-size:14px;font-weight:900}
      .taobao-icon rect,.pdd-icon rect,.douyin-icon rect,.e1688-icon rect{fill:#d9f99d}
      .tmall-icon rect{fill:#18181b}.tmall-icon text{fill:#fff}
      .cat-ear{fill:#18181b;stroke:#18181b;stroke-width:2.4;stroke-linejoin:round}
      .douyin-note{fill:none;stroke:#18181b;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .logo-mark{fill:#18181b}.logo-text{fill:#fff;font:950 30px system-ui;text-anchor:middle}
      .doodle{stroke:#365314;stroke-width:3.2;stroke-dasharray:1 9}
      .spark,.doodle{animation:softPulse 2.6s ease-in-out infinite}
      .loop,.cloud{animation:dashFlow 7s linear infinite}
      @keyframes dashFlow{to{stroke-dashoffset:-72}}
      @keyframes softPulse{50%{opacity:.42}}
      @media (prefers-reduced-motion: reduce){
        .arrow,.spark,.doodle,.loop,.cloud{animation:none}
      }
    </style>
  </defs>
  <rect class="paper-bg" width="1280" height="620" rx="18" />
  <path class="cloud" d="M72 124 C104 86,151 84,180 114 C205 82,268 90,284 132 C330 138,349 190,315 220 C288 252,229 244,210 218 C178 244,122 242,100 206 C62 206,41 158,72 124 Z" />
  <path class="cloud" d="M1000 82 C1024 50,1076 52,1098 82 C1128 58,1177 82,1177 122 C1214 132,1217 184,1182 201 C1152 219,1108 209,1090 184 C1066 211,1012 205,998 170 C956 164,954 112,1000 82 Z" />
  <g transform="translate(90 252) rotate(-2)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="4.4s" repeatCount="indefinite" additive="sum" />
    <rect class="card" width="205" height="132" rx="18" />
    <path class="line" d="M32 88 L70 48 L99 78 L120 60 L162 96" />
    <circle class="sun" cx="142" cy="42" r="13" />
    <text class="node-title" x="26" y="34">上传素材</text>
    <text class="note" x="26" y="116">实拍图 / SKU / 包装</text>
  </g>
  <path class="arrow" d="M318 318 C370 292,418 294,462 318" />
  <g transform="translate(486 220) rotate(1)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 7;0 0" dur="5.2s" repeatCount="indefinite" additive="sum" />
    <rect class="card lime" width="238" height="190" rx="26" />
    <circle class="orbit" cx="119" cy="82" r="44" />
    <path class="spark" d="M119 42 L127 73 L158 82 L127 91 L119 124 L110 91 L80 82 L110 73 Z" />
    <text class="node-title center" x="119" y="154">AI 分析商品</text>
    <text class="note center" x="119" y="176">主体 / 卖点 / 风格</text>
  </g>
  <path class="arrow" d="M742 314 C790 290,833 287,880 310" />
  <g transform="translate(884 212)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="4.8s" repeatCount="indefinite" additive="sum" />
    <path class="loop" d="M18 88 C54 18,170 4,246 54 C318 101,306 202,224 236 C148 268,49 232,18 166 C4 136,4 113,18 88 Z" />
    <text class="platform-title" x="40" y="52">适配平台</text>
    <g class="platform-icon taobao-icon" transform="translate(40 76) rotate(-5)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="3.4s" begin=".1s" repeatCount="indefinite" additive="sum" />
      <rect width="58" height="58" rx="18" />
      <text x="29" y="39">淘</text>
    </g>
    <g class="platform-icon tmall-icon" transform="translate(128 70) rotate(4)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 5;0 0" dur="3.8s" begin=".35s" repeatCount="indefinite" additive="sum" />
      <path class="cat-ear" d="M13 7 L23 -4 L31 8" />
      <path class="cat-ear" d="M33 8 L43 -4 L51 7" />
      <rect width="64" height="58" rx="18" />
      <text x="32" y="39">猫</text>
    </g>
    <g class="platform-icon e1688-icon" transform="translate(210 126) rotate(4)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3.6s" begin=".65s" repeatCount="indefinite" additive="sum" />
      <rect width="76" height="48" rx="18" />
      <text class="mini" x="38" y="30">1688</text>
    </g>
    <g class="platform-icon pdd-icon" transform="translate(46 154) rotate(3)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 5;0 0" dur="4s" begin=".9s" repeatCount="indefinite" additive="sum" />
      <rect width="58" height="58" rx="18" />
      <text x="29" y="39">拼</text>
    </g>
    <g class="platform-icon douyin-icon" transform="translate(142 178) rotate(-3)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="3.7s" begin="1.15s" repeatCount="indefinite" additive="sum" />
      <rect width="58" height="58" rx="18" />
      <path class="douyin-note" d="M34 16 L34 36 C34 46,25 49,20 44 C16 40,17 34,22 31 C26 29,30 30,34 32 L34 14 C41 22,46 24,52 24" />
    </g>
  </g>
  <path class="arrow" d="M1004 448 C870 512,659 530,462 486 C342 459,240 426,160 462" />
  <g transform="translate(104 438) rotate(2)"><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="4.2s" begin=".2s" repeatCount="indefinite" additive="sum" /><rect class="out" width="156" height="94" rx="16" /><text class="output-title" x="24" y="38">主图 5 张</text><path class="line" d="M24 58 L132 58" /><path class="line" d="M24 74 L92 74" /></g>
  <g transform="translate(306 456) rotate(-2)"><animateTransform attributeName="transform" type="translate" values="0 0;0 5;0 0" dur="4.6s" begin=".5s" repeatCount="indefinite" additive="sum" /><rect class="out" width="178" height="104" rx="16" /><text class="output-title" x="24" y="38">详情页</text><text class="note" x="24" y="66">8-12屏长图</text></g>
  <g transform="translate(542 456) rotate(2)"><animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="4.4s" begin=".8s" repeatCount="indefinite" additive="sum" /><rect class="out" width="164" height="94" rx="16" /><text class="output-title" x="24" y="38">SKU 图</text><circle class="dot-lime" cx="36" cy="66" r="8" /><circle class="dot" cx="64" cy="66" r="8" /><circle class="dot" cx="92" cy="66" r="8" /></g>
  <g transform="translate(762 438) rotate(-2)"><animateTransform attributeName="transform" type="translate" values="0 0;0 5;0 0" dur="4.8s" begin="1.1s" repeatCount="indefinite" additive="sum" /><rect class="out" width="184" height="108" rx="16" /><rect class="logo-mark" x="22" y="24" width="48" height="48" rx="12" /><text class="logo-text" x="46" y="58">P</text><text class="output-title" x="86" y="42">Logo</text><text class="note" x="86" y="68">头像 / 店招</text></g>
  <path class="doodle" d="M1154 398 L1164 424 L1190 432 L1164 440 L1154 466 L1144 440 L1118 432 L1144 424 Z" />
  <path class="doodle" d="M104 540 C132 573,184 572,212 540" />
  <path class="doodle" d="M1080 548 C1112 526,1128 570,1160 548 C1188 530,1205 566,1230 550" />
</svg>
