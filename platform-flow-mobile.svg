<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 880" role="img" aria-labelledby="flow-mobile-title flow-mobile-desc">
  <title id="flow-mobile-title">移动端电商素材生成流程图</title>
  <desc id="flow-mobile-desc">上传素材后，AI 分析商品，生成商品主图、卖点详情、规格展示和店铺视觉，并适配多个国内电商平台。</desc>
  <defs>
    <linearGradient id="mobile-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset=".62" stop-color="#f2fdff" />
      <stop offset="1" stop-color="#ffffff" />
    </linearGradient>
    <marker id="mobile-arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#2d3035" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <filter id="mobile-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#18181b" flood-opacity="0.10" />
    </filter>
    <style>
      .paper{fill:url(#mobile-bg)}
      .card{fill:#fff;stroke:#24262b;stroke-width:2.6;filter:url(#mobile-shadow)}
      .ai{fill:#d9f99d;stroke:#18181b;stroke-width:3.2;filter:url(#mobile-shadow)}
      .output{fill:#fff;stroke:#2e3035;stroke-width:2;filter:url(#mobile-shadow)}
      .title{fill:#18181b;font:700 22px system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
      .ai-title{fill:#18181b;font:800 27px system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;text-anchor:middle}
      .note{fill:#71717a;font:620 15px system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
      .output-title{fill:#18181b;font:700 16px system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;text-anchor:middle}
      .output-note{fill:#71717a;font:600 12px system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;text-anchor:middle}
      .line,.spark,.orbit,.image-line{fill:none;stroke:#18181b;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
      .arrow{fill:none;stroke:#2d3035;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 9;marker-end:url(#mobile-arrow);opacity:.58}
      .dot{fill:#d9f99d;stroke:#18181b;stroke-width:2.8}
      .platform-wrap{fill:rgba(255,255,255,.9);stroke:#d8edf1;stroke-width:2;filter:url(#mobile-shadow)}
      .platform-title{fill:#18181b;font:700 20px system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;text-anchor:middle}
      .chip rect{fill:#d9f99d;stroke:#18181b;stroke-width:2.4}
      .chip text{fill:#18181b;text-anchor:middle;font:800 18px system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
      .chip-dark rect{fill:#18181b}
      .chip-dark text{fill:#fff}
      .mini text{font-size:13px}
    </style>
  </defs>

  <rect class="paper" width="420" height="880" rx="18" />

  <g transform="translate(74 48) rotate(-1)">
    <rect class="card" width="272" height="126" rx="18" />
    <path class="image-line" d="M34 86 L76 46 L108 74 L132 56 L174 92" />
    <circle class="dot" cx="196" cy="44" r="14" />
    <text class="title" x="28" y="38">上传素材</text>
    <text class="note" x="28" y="108">实拍图 / SKU / 包装</text>
  </g>

  <path class="arrow" d="M210 188 V220" />

  <g transform="translate(44 236)">
    <rect class="ai" width="332" height="188" rx="28" />
    <circle class="orbit" cx="166" cy="70" r="42" />
    <path class="spark" d="M166 30 L174 60 L206 70 L174 80 L166 114 L157 80 L125 70 L157 60 Z" />
    <text class="ai-title" x="166" y="138">AI 分析商品</text>
    <text class="note" x="166" y="164" text-anchor="middle">主体 / 卖点 / 风格</text>
  </g>

  <path class="arrow" d="M210 442 V474" />

  <g transform="translate(30 500)">
    <g>
      <rect class="output" width="174" height="78" rx="16" />
      <text class="output-title" x="87" y="32">商品主图</text>
      <text class="output-note" x="87" y="55">平台尺寸适配</text>
    </g>
    <g transform="translate(196 0)">
      <rect class="output" width="174" height="78" rx="16" />
      <text class="output-title" x="87" y="32">卖点详情</text>
      <text class="output-note" x="87" y="55">长图排版生成</text>
    </g>
    <g transform="translate(0 96)">
      <rect class="output" width="174" height="78" rx="16" />
      <text class="output-title" x="87" y="32">规格展示</text>
      <text class="output-note" x="87" y="55">颜色规格展示</text>
    </g>
    <g transform="translate(196 96)">
      <rect class="output" width="174" height="78" rx="16" />
      <text class="output-title" x="87" y="32">店铺视觉</text>
      <text class="output-note" x="87" y="55">Logo / 店招素材</text>
    </g>
  </g>

  <path class="arrow" d="M210 692 V724" />

  <g transform="translate(48 744)">
    <rect class="platform-wrap" width="324" height="126" rx="22" />
    <text class="platform-title" x="162" y="34">适配平台</text>
    <g class="chip" transform="translate(28 56)">
      <rect width="48" height="44" rx="14" />
      <text x="24" y="29">淘</text>
    </g>
    <g class="chip chip-dark" transform="translate(88 56)">
      <rect width="48" height="44" rx="14" />
      <text x="24" y="29">猫</text>
    </g>
    <g class="chip" transform="translate(148 56)">
      <rect width="48" height="44" rx="14" />
      <text x="24" y="29">拼</text>
    </g>
    <g class="chip" transform="translate(208 56)">
      <rect width="48" height="44" rx="14" />
      <text x="24" y="29">抖</text>
    </g>
    <g class="chip mini" transform="translate(268 56)">
      <rect width="58" height="44" rx="14" />
      <text x="29" y="28">1688</text>
    </g>
  </g>
</svg>
