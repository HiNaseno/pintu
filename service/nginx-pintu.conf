# Included from nginx.conf's http block via sites-enabled.
# Do not log query strings, request bodies, cookies or authorization headers.
log_format pintu_minimal '$time_iso8601 $request_method $status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;
    server_tokens off;

    access_log /var/log/nginx/pintu-access.log pintu_minimal;
    error_log /var/log/nginx/pintu-error.log warn;

    client_max_body_size 70m;
    client_body_timeout 120s;

    # This application uses HTTP polling; every WebSocket entry remains closed.
    if ($http_upgrade != "") { return 403; }

    location / {
        # Keep all private downloads and generated images behind Node ownership checks.
        proxy_pass http://127.0.0.1:5176;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 1800s;
        proxy_next_upstream off;
        proxy_cache off;
        proxy_intercept_errors off;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

# Unknown hosts must not fall through to the application.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    return 404;
}
